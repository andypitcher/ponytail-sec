name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint .

  json-lint:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint JSON files
        run: |
          find . -name "*.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | while read -r file; do
            echo "Linting $file"
            # 'jq empty' parses the file to check for syntax errors without printing the output
            jq empty "$file"
          done

      - name: Validate findings.json schema
        run: |
          set -euo pipefail
          mapfile -t files < <(find .ponytail-sec -name findings.json 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .ponytail-sec findings.json files found; skipping."
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            echo "Validating $file"
            errors=$(jq -r '
              [
                (select(.schema_version != 2)
                 | "schema_version must be 2"),
                (["code", "dependency", "security"][] as $k
                 | select((.findings | has($k)) | not)
                 | "missing findings bucket: \($k)"),
                (.findings.security // [] | .[]
                 | select((.class | IN("vulnerability", "hardening")) | not)
                 | "\(.id): class must be vulnerability or hardening"),
                (.findings[][] as $f | $f | to_entries[]
                 | select(.value == null)
                 | "\($f.id): \(.key) is null; omit non-applicable keys entirely"),
                (.findings.security // [] | .[]
                 | select(.class == "vulnerability")
                 | select((.cvss_score | type) != "number"
                           or (.cvss | type) != "string"
                           or (.cvss | startswith("CVSS:4.0/") | not)
                           or (.severity | type) != "string")
                  | "\(.id): a vulnerability needs severity, a CVSS:4.0/ vector in cvss, and a numeric cvss_score"),
                (.findings.security // [] | .[]
                 | select(.class == "vulnerability")
                 | select(has("efficacy") or has("efficacy_score"))
                 | "\(.id): efficacy is not allowed on a vulnerability"),
                (.findings.security // [] | .[]
                 | select(.class == "hardening")
                 | select((.efficacy | IN("High", "Medium", "Low")) | not)
                 | "\(.id): hardening needs efficacy High, Medium, or Low"),
                (.findings.security // [] | .[]
                 | select(.class == "hardening")
                 | select(has("cve"))
                 | "\(.id): cve is not allowed on a hardening finding"),
                (.findings.security // [] | .[]
                 | select(has("cve") and ((.cve | type) != "string"
                           or (.cve | startswith("CVE-") | not)))
                 | "\(.id): cve must be a CVE- string when present"),
                (.findings.security // [] | .[]
                 | select(.class == "hardening")
                 | select(has("severity") or has("cvss") or has("cvss_score"))
                 | "\(.id): severity/CVSS fields are not allowed on a hardening finding"),
                (.findings.security // [] | .[]
                 | select(has("efficacy_score"))
                 | "\(.id): efficacy is categorical; efficacy_score is not part of the schema"),
                (.findings.security // [] | .[]
                 | select(has("cwe") and ((.cwe | type) != "string"
                           or (.cwe | startswith("CWE-") | not)))
                 | "\(.id): cwe must be a CWE- string when present"),
                (.findings.security // [] | .[]
                 | select((.status | IN("open", "triaged", "accepted-risk", "resolved")) | not)
                 | "\(.id): status must be open, triaged, accepted-risk, or resolved"),
                ((.findings.code // []) + (.findings.dependency // []) | .[]
                 | select(has("cvss_score") or has("cvss") or has("severity")
                           or has("efficacy") or has("efficacy_score")
                           or has("cwe") or has("cve"))
                 | "\(.id): severity/CVSS/efficacy/CWE fields are not allowed on code/dependency findings"),
                ((.findings.code // []) + (.findings.dependency // [])
                   + (.findings.security // []) | .[]
                 | select((.break_risk | IN("High", "Medium", "Low")) | not)
                 | "\(.id): break_risk must be High, Medium, or Low")
              ][]
            ' "$file")
            if [ -n "$errors" ]; then
              echo "$errors" | sed 's/^/  ERROR: /'
              status=1
            fi
          done
          exit "$status"
