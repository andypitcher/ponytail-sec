name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint .

  json-lint:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint JSON files
        run: |
          find . -name "*.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | while read -r file; do
            echo "Linting $file"
            # 'jq empty' parses the file to check for syntax errors without printing the output
            jq empty "$file"
          done

      - name: Validate findings schema fixtures
        run: |
          set -euo pipefail
          for file in tests/fixtures/findings/valid/*.json; do
            echo "Expecting valid fixture: $file"
            errors=$(jq -f scripts/validate-findings.jq "$file" | jq -r '.[]?')
            if [ -n "$errors" ]; then
              echo "$errors" | sed 's/^/  ERROR: /'
              exit 1
            fi
          done
          for file in tests/fixtures/findings/invalid/*.json; do
            echo "Expecting invalid fixture: $file"
            errors=$(jq -f scripts/validate-findings.jq "$file" | jq -r '.[]?')
            if [ -z "$errors" ]; then
              echo "  ERROR: invalid fixture passed validation"
              exit 1
            fi
          done

      - name: Validate committed findings.json files
        run: |
          set -euo pipefail
          mapfile -t files < <(find .ponytail-sec -name findings.json 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .ponytail-sec findings.json files found; skipping."
            exit 0
          fi
          for file in "${files[@]}"; do
            schema_version=$(jq -r '.schema_version // empty' "$file")
            if [ "$schema_version" = "2" ]; then
              echo "WARNING: Skipping legacy v2 findings file $file"
              continue
            fi
            echo "Validating $file"
            errors=$(jq -f scripts/validate-findings.jq "$file" | jq -r '.[]?')
            if [ -n "$errors" ]; then
              echo "$errors" | sed 's/^/  ERROR: /'
              exit 1
            fi
          done
