name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint .

  json-lint:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint JSON files
        run: |
          find . -name "*.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | while read -r file; do
            echo "Linting $file"
            # 'jq empty' parses the file to check for syntax errors without printing the output
            jq empty "$file"
          done

      - name: Validate findings.json schema
        run: |
          set -euo pipefail
          mapfile -t files < <(find .ponytail-sec -name findings.json 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .ponytail-sec findings.json files found; skipping."
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            if [ "$(jq -r '.schema_version // empty' "$file")" = "2" ]; then
              echo "WARNING: $file is legacy schema v2; skipping (the audit migrates it on read)."
              continue
            fi
            echo "Validating $file"
            errors=$(jq -r '
              [
                (select(.schema_version != 3)
                 | "schema_version must be 3"),
                (["code", "dependency", "security"][] as $k
                 | select((.findings | has($k)) | not)
                 | "missing findings bucket: \($k)"),
                (.findings[][] as $f | $f | to_entries[]
                 | select(.value == null)
                 | "\($f.id): \(.key) is null; omit non-applicable keys entirely"),
                ((.findings.code // []) + (.findings.dependency // [])
                   + (.findings.security // []) | .[]
                 | if (.title | type) != "string" or (.title | length) == 0 then
                     "\(.id): title must be a non-empty string"
                   elif (.title | length) > 100 then
                     "\(.id): title must be 100 characters or fewer"
                   elif (.title | test("[\\r\\n]")) then
                     "\(.id): title must be on one line"
                   elif (.title | test("\\.$")) then
                     "\(.id): title must not end with a period"
                   elif (.title | test("[A-Za-z0-9_./-]+\\.[A-Za-z0-9]+:[0-9]+|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+:[0-9]+")) then
                     "\(.id): title must not contain file paths or line numbers"
                   else empty end),
                ((.findings.code // []) + (.findings.dependency // [])
                   + (.findings.security // []) | .[]
                 | select((.break_risk | IN("High", "Medium", "Low")) | not)
                 | "\(.id): break_risk must be High, Medium, or Low"),
                ((.findings.code // []) + (.findings.dependency // [])
                   + (.findings.security // []) | .[]
                 | select((.status | IN("open", "triaged", "accepted-risk", "resolved")) | not)
                 | "\(.id): status must be open, triaged, accepted-risk, or resolved"),
                (.findings.security // [] | .[]
                 | select((.class | IN("vulnerability", "hardening")) | not)
                 | "\(.id): class must be vulnerability or hardening"),
                (.findings.security // [] | .[]
                 | select(.class == "vulnerability")
                 | select((.cvss_score | type) != "number"
                          or (.cvss | type) != "string"
                          or (.cvss | startswith("CVSS:4.0/") | not)
                          or (.cvss_nomenclature | IN("CVSS-B", "CVSS-BT", "CVSS-BTE") | not)
                          or (.severity | IN("Critical", "High", "Medium", "Low") | not))
                 | "\(.id): a vulnerability needs severity, a CVSS:4.0/ vector in cvss, a numeric cvss_score, and cvss_nomenclature"),
                (.findings.security // [] | .[]
                 | select(.class == "vulnerability" and (.cvss_score | type) == "number")
                 | (if .cvss_score >= 9 then "Critical"
                    elif .cvss_score >= 7 then "High"
                    elif .cvss_score >= 4 then "Medium"
                    else "Low" end) as $band
                 | select(.severity != $band)
                 | "\(.id): severity \(.severity) does not match cvss_score \(.cvss_score) (expected \($band))"),
                (.findings.security // [] | .[]
                 | select(.class == "vulnerability")
                 | select(has("efficacy") or has("efficacy_score") or has("cwe"))
                 | "\(.id): efficacy and cwe are not allowed on a vulnerability"),
                (.findings.security // [] | .[]
                 | select(has("cve") and ((.cve | type) != "string"
                          or (.cve | startswith("CVE-") | not)))
                 | "\(.id): cve must be a CVE- string when present"),
                (.findings.security // [] | .[]
                 | select(.class == "hardening")
                 | select((.efficacy | IN("High", "Medium", "Low")) | not)
                 | "\(.id): hardening needs efficacy High, Medium, or Low"),
                (.findings.security // [] | .[]
                 | select(.class == "hardening")
                 | select((.cwe | type) != "string" or (.cwe | startswith("CWE-") | not))
                 | "\(.id): hardening requires a CWE- identifier"),
                (.findings.security // [] | .[]
                 | select(.class == "hardening")
                 | select(has("severity") or has("cvss") or has("cvss_score")
                          or has("cvss_nomenclature") or has("efficacy_score") or has("cve"))
                 | "\(.id): severity/CVSS/efficacy_score/cve fields are not allowed on hardening"),
                ((.findings.code // []) + (.findings.dependency // []) | .[]
                 | select(has("cvss_score") or has("cvss") or has("severity")
                          or has("cvss_nomenclature") or has("efficacy")
                          or has("efficacy_score") or has("cwe") or has("cve"))
                 | "\(.id): severity/CVSS/efficacy/CWE fields are not allowed on code/dependency findings")
              ][]
            ' "$file")
            if [ -n "$errors" ]; then
              echo "$errors" | sed 's/^/  ERROR: /'
              status=1
            fi
          done
          exit "$status"
