name: Plugin security

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:

# Declare default permissions as read only.
permissions: read-all

jobs:
  plugin-validate:
    name: Claude plugin validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned Claude Code binary"
        env:
          CLAUDE_VERSION: "2.1.316"
          CLAUDE_PLATFORM: linux-x64
          CLAUDE_RELEASES: https://downloads.claude.ai/claude-code-releases
          CLAUDE_KEY_FINGERPRINT: "31DD DE24 DDFA B679 F42D  7BD2 BAA9 29FF 1A7E CACE"
        run: |
          set -euo pipefail

          curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o claude-code.asc
          gpg --import claude-code.asc
          # Verify against a keyring holding only the pinned key: gpg --verify
          # would accept a signature from any other key in claude-code.asc.
          gpg --export "${CLAUDE_KEY_FINGERPRINT// /}" > pinned.gpg
          test -s pinned.gpg

          curl -fsSLO "$CLAUDE_RELEASES/$CLAUDE_VERSION/manifest.json"
          curl -fsSLO "$CLAUDE_RELEASES/$CLAUDE_VERSION/manifest.json.sig"
          gpgv --keyring ./pinned.gpg manifest.json.sig manifest.json

          curl -fsSL "$CLAUDE_RELEASES/$CLAUDE_VERSION/$CLAUDE_PLATFORM/claude" -o claude

          expected_checksum="$(jq -r --arg platform "$CLAUDE_PLATFORM" '.platforms[$platform].checksum // empty' manifest.json)"
          test -n "$expected_checksum"

          actual_checksum="$(sha256sum claude | awk '{print $1}')"
          test "$actual_checksum" = "$expected_checksum"

          chmod +x claude
          sudo install -m 0755 claude /usr/local/bin/claude

      - name: "Validate Claude plugin"
        env:
          DISABLE_AUTOUPDATER: "1"
        run: claude plugin validate . --strict

      # No signature is published, so pin the build and its SHA-512 here; bump both
      # from .../manifests/linux_amd64.json on the auto-updater. A root-owned
      # install keeps the background self-updater from swapping the binary.
      - name: "Install pinned Antigravity CLI"
        env:
          AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.6-6212266538958848/linux-x64/cli_linux_x64.tar.gz
          AGY_SHA512: 0c67824908caf9cc3156699802b8097f2fd02c4608ae9293c9aa7f17e1bcd342c4b9c2e158388253a37804ef6bd9c6b1d25cfaca3c07bbb7587378fc91839bb4
        run: |
          set -euo pipefail
          curl -fsSL "$AGY_URL" -o agy.tar.gz
          echo "$AGY_SHA512  agy.tar.gz" | sha512sum -c -
          tar -xzf agy.tar.gz antigravity
          sudo install -m 0755 antigravity /usr/local/bin/agy

      - name: "Validate Antigravity plugin"
        run: agy plugin validate .
