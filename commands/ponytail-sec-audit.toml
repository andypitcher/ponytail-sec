description = "Audit the whole repo for security attack surface, dependency risk, and hardening gaps"
prompt = "Run ponytail-sec-audit over the entire repository, not just the diff. Scan source files, dependency manifests, Dockerfiles, deployment manifests, config, and security-sensitive paths. Run three passes: 1) Code — code that should not exist, YAGNI, stdlib first, remove over refactor. 2) Dependencies — assess all dependencies with registry evidence and OpenSSF Scorecard where available. 3) Security — list all findings in kill-chain stage order in a table with columns #, Class, Rating, Stage, Location, Finding, Fix, Break-risk. Class is Vulnerability, CVE, or Hardening. Rating is 'Severity: <Level> (CVSS-B <score>)' for vulnerabilities and 'Efficacy: <Level>' for hardening. Vulnerabilities carry a severity, a CVSS 4.0 base vector prefixed CVSS:4.0/, a numeric score, and cvss_nomenclature CVSS-B; severity must match the score band (>=9 Critical, >=7 High, >=4 Medium, >0 Low); vulnerabilities never carry a CWE or efficacy. Hardening findings carry a categorical efficacy (High/Medium/Low) — how much attacker leverage the fix removes — plus a required CWE, and never a severity, a CVSS field, or a numeric efficacy score. Every finding in every pass has a short title: one line, about 80 characters (100 max), no trailing period, weakness plus impact, no file paths or line numbers. Put tags and the CWE in the Finding cell as one leading badge such as [rbac · CWE-269], and spell levels out in full (High/Medium/Low, never Med) in Rating and Break-risk alike. Persist schema v3 findings.json, emitting only the keys that apply to the finding's class and omitting the rest rather than writing nulls; recurring findings carry forward their class, measurement fields, status, and title. Close with a blast-radius narrative noting scores are CVSS-B, and a frank 'if I were you' prioritisation. When open security findings remain, end with: 'N open findings (X vulnerability, Y hardening), M with Medium/High break risk that need runtime verification. Want me to run `/ponytail-sec-triage` on them? `all`, pick by number (e.g. `S1`), or `no`.' and run /ponytail-sec-triage on the chosen findings. When asked about a finding by number, explain root cause, the CVSS-B score and vector (or efficacy and CWE for hardening), exploit scenario, and delegate the fix to ponytail."