description = "Audit the whole repo for security attack surface, dependency risk, and hardening gaps"
prompt = "Run ponytail-sec-audit over the entire repository, not just the diff. Scan source files, dependency manifests, Dockerfiles, deployment manifests, config, and security-sensitive paths. Run three passes: 1) Code — code that should not exist, YAGNI, stdlib first, remove over refactor. 2) Dependencies — assess all dependencies with registry evidence and OpenSSF Scorecard where available. 3) Security — list all findings in kill-chain stage order in a table with columns #, Class, Rating, Stage, Location, Finding, Fix, and Break-risk. Class is Vulnerability, CVE, or Hardening. Rating is 'Severity: <Level> (CVSS-B <score>)' for vulnerabilities and 'Efficacy: <Level>' for hardening. Vulnerabilities require a CVSS-B 4.0 severity, score, vector, and cvss_nomenclature; hardening requires categorical efficacy (High/Medium/Low) and a CWE, and must never have severity or CVSS fields. Vulnerabilities must not have CWE or efficacy fields. Severity bands must match CVSS-B scores (>=9 Critical, >=7 High, >=4 Medium, >0 Low). Every finding in every pass requires a short title, about 80 characters and at most 100, one line, no trailing period, weakness plus impact, and no paths or line numbers. Put tags and the CWE in the Finding cell as one leading badge such as [rbac · CWE-269], and spell levels out in full (High/Medium/Low, never Med) in Rating and Break-risk. In persisted schema v3 JSON, emit only applicable keys and omit non-applicable keys rather than writing nulls. Close with a blast-radius narrative and a frank 'if I were you' prioritisation. When asked to expand a finding by number, explain root cause, the CVSS-B vector (or efficacy and CWE for hardening), exploit scenario, and delegate the fix to ponytail."
