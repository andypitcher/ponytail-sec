description = "Audit the whole repo for security attack surface, dependency risk, and hardening gaps"
prompt = "Run ponytail-sec-audit over the entire repository, not just the diff. Scan source files, dependency manifests, Dockerfiles, deployment manifests, config, and security-sensitive paths. Run three passes: 1) Code — code that should not exist, YAGNI, stdlib first, remove over refactor. 2) Dependencies — assess all dependencies with registry evidence and OpenSSF Scorecard where available. 3) Security — list all findings in kill-chain stage order in a table with Class and Rating columns: Class is Vulnerability, CVE, or Hardening; Rating is 'Severity: <Level> (<score>)' for vulnerabilities and 'Efficacy: <Level>' for hardening. Vulnerabilities carry a severity and a CVSS 4.0 base score, hardening findings carry a categorical efficacy (High/Medium/Low) — how much attacker leverage the fix removes — plus a CWE, and never a severity, a CVSS score, or a numeric efficacy score. Put tags and the CWE in the Finding cell as one leading badge such as [rbac · CWE-269], and spell levels out in full (High/Medium/Low, never Med) in Rating and Break-risk alike. In persisted JSON, emit only the keys that apply to the finding's class and omit the rest entirely rather than writing nulls. Close with a blast-radius narrative and a frank 'if I were you' prioritisation. When asked to expand a finding by number, explain root cause, the CVSS vector (or efficacy and CWE for hardening), exploit scenario, and delegate the fix to ponytail."
