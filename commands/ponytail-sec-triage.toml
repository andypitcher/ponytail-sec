description = "Triage audit security findings or a pasted finding with repository and user context"
prompt = "Run the ponytail-sec-triage skill. Use its bash + jq scripts: find-scan.sh to pick the latest audit or --scan (verify findings_sha256, reject schema v2 and ask for a re-run of ponytail-sec-audit) and list-findings.sh to show ID, class, title, and triaged status. Select supplied IDs or 'all' untriaged; handle a pasted finding standalone. Step 0: list repository security context and published advisories if gh is already available (never install it), then offer up to five skippable questions, free text, or skip, recording answers as quoted user: entries in context. Build one evidence bundle per finding (finding, code with callers and callees, context, answers) for a fresh, read-only ponytail-sec-triage agent that never sees the audit narrative or ranking and never runs commands (the main agent runs the evidence commands it asks for, after user approval); run inline with agent: inline when subagents are unavailable. Write one self-contained triage/<ID>.triage.md per finding with the skill's frontmatter (fingerprint, vex_status, evidence, v3 class fields) and sections 1-9 plus appendix. affected needs evidence, otherwise under_investigation; not_affected needs a justification and a source; never set fixed. Score in isolation; full CVSS 4.0 table for vulnerabilities, efficacy reasoning in words for hardening; confirm any reclassification [y/N]; never invent a CVE. Propose the smallest fix, never apply it. Run check-triage.sh, build-index.sh, and shell-summary.sh; leave findings.json and meta.json untouched."
