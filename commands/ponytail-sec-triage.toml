description = "Triage the latest ponytail-sec-audit findings into practical, actionable dispositions"
prompt = "Run ponytail-sec-triage on the latest audit report in .ponytail-sec/ (or the scan directory specified). Read findings.json and meta.json, evaluate each code, dependency, and security finding by attacker leverage, reachability, and break-risk. Group findings into four practical dispositions: Fix Now (hotfix with high leverage), Sprint (scheduled hardening), Verify First (high break-risk removals requiring runtime tests), and Accept (compensated or accepted risk). Highlight compound wins where one deletion eliminates multiple findings, provide an actionable plan, persist triage artifacts, and offer to delegate fixes to ponytail."
