description = "Triage audit findings or a pasted finding with repository and user context"
prompt = "Run the ponytail-sec-triage skill. Use its read-only scan helper to find the latest audit or --scan, verify findings_sha256 against meta.json, reject schema v2 with a request to re-run ponytail-sec-audit, and determine triage status from triage/<ID>.triage.md. Select supplied IDs or handle a pasted finding standalone; otherwise offer all untriaged, select, re-triage, paste, or quit. Before reviewing, list auto-found repository security/deployment context and published repository advisories if gh is already available (never install it). Ask whether to answer up to five finding-specific, skippable questions, supply free text, or skip. Include a question about previous similar advisories/issues/PRs/pentest notes, and name the finding and decision each question informs. Record every answer as a quoted user: entry in the report's context list. Follow the audit's v3 class-specific fields, omit inapplicable keys rather than writing null, and spell levels in full. Support --output file (default), shell (no writes), or both. Report evidence, uncertainties, and a minimal suggested fix; never apply fixes or modify the audit files."
